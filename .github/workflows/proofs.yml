name: StudioNet escrow market proofs
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Complete suite or an independent market
        type: choice
        default: all
        options: [all, cross, gap, screen]
permissions:
  contents: read
concurrency:
  group: cross-ledger-studionet-${{ inputs.scenario || 'all' }}
  cancel-in-progress: false
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CROSS_SCENARIO: ${{ inputs.scenario || 'all' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned tooling
        run: |
          pip install -r requirements-dev.txt
          npm install --global genlayer@0.39.2
          genvm-lint download --version v0.2.16
      - name: Lint and test consensus, escrow and exhaustive fill oracles
        run: |
          genvm-lint check contracts/cross_ledger.py --json
          node --test tests/rpc-preflight.test.cjs
          python -m pytest tests/direct -q --junitxml=proofs/cloud-direct-tests.xml
      - name: Prepare three encrypted disposable signing wallets
        run: node scripts/bootstrap-ci.cjs
      - name: Deploy and exercise selected market
        run: node scripts/live-proof.cjs
      - name: Verify fresh source, signers, calldata, complete votes and native balances
        run: node scripts/verify-proofs.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studionet-proofs
          path: |
            proofs/*.json
            proofs/*.xml
